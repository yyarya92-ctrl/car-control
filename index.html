<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Car Control</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100vw; height: 100vh; height: 100dvh;
    background: #050810; color: #fff;
    font-family: Tahoma, sans-serif;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    touch-action: none;
  }
  #rotateMsg {
    display: none; position: fixed; inset: 0;
    background: #111; z-index: 999;
    align-items: center; justify-content: center;
    text-align: center; font-size: 18px; padding: 20px;
  }
  @media (orientation: portrait) {
    #rotateMsg { display: flex; }
    #panel { display: none !important; }
  }

  #panel {
    width: 99vw; height: 98vh; height: 98dvh;
    max-width: 1400px;
    background: radial-gradient(ellipse at center, #0a1420 0%, #020408 100%);
    border: 2px solid #1a3050;
    border-radius: 14px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    box-shadow: 0 0 40px rgba(0,150,255,0.15), inset 0 0 60px rgba(0,0,0,0.9);
  }

  /* ===== نوار وضعیت ===== */
  #statusBar {
    display: flex; align-items: center; justify-content: center;
    height: 22px;
    font-size: 12px;
    border-radius: 6px;
    background: rgba(0,20,40,0.6);
    border: 1px solid #1a3050;
    color: #8ab8e0;
    transition: all 0.3s;
  }
  #statusBar.online  { color: #4ade80; border-color: #1a6040; background: rgba(0,40,20,0.5); }
  #statusBar.offline { color: #ff5050; border-color: #602020; background: rgba(40,0,0,0.5); }
  #statusBar::before { content: '⚪ '; margin-left: 5px; }
  #statusBar.online::before  { content: '🟢 '; }
  #statusBar.offline::before { content: '🔴 '; }

  /* ===== بدنه اصلی ===== */
  #mainRow {
    flex: 1;
    display: flex;
    gap: 6px;
    min-height: 0;
  }

  /* ===== ستون چپ ===== */
  #leftCol {
    flex: 5;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  #spinBox {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(0,20,40,0.6);
    border: 2px solid #1a4a80;
    border-radius: 10px;
    padding: 3px 8px;
    height: 46px;
  }
  .spinArrow {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle, #0060c0, #003070);
    border: 2px solid #2a90ff;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: bold;
    box-shadow: 0 0 12px rgba(0,150,255,0.6);
    cursor: pointer;
  }
  .spinArrow.active {
    background: radial-gradient(circle, #ff9020, #b35a00);
    border-color: #f39c12;
    box-shadow: 0 0 22px rgba(243,156,18,0.9);
  }
  #spinLabel {
    flex: 1; text-align: center;
    font-size: 18px; font-weight: bold;
    color: #4ab8ff;
    text-shadow: 0 0 10px rgba(74,184,255,0.8);
  }

  #wheelZone {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    min-height: 0;
  }
  #wheel {
    width: auto; height: 100%;
    aspect-ratio: 1/1;
    max-width: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #2a2a2a 0%, #111 75%, #000 100%);
    border: 22px solid #1a1a1a;
    box-shadow: 0 0 0 2px #2a90ff, inset 0 0 30px rgba(0,0,0,0.95), 0 0 30px rgba(0,100,200,0.3);
    position: relative;
    cursor: grab;
    touch-action: none;
  }
  #wheel.dragging { cursor: grabbing; }
  #wheel::before {
    content: '';
    position: absolute;
    bottom: 10px; left: 50%;
    width: 38%; height: 22%;
    transform: translateX(-50%);
    background: linear-gradient(145deg, #e8e8e8, #888 50%, #ccc);
    clip-path: polygon(20% 0%, 80% 0%, 65% 100%, 35% 100%);
    border-radius: 4px;
  }
  #wheel::after {
    content: '';
    position: absolute;
    top: -2px; left: 50%;
    width: 5px; height: 28px;
    background: #2a90ff;
    transform: translateX(-50%);
    border-radius: 3px;
    box-shadow: 0 0 10px #2a90ff;
  }
  #hub {
    position: absolute; top: 50%; left: 50%;
    width: 30%; height: 30%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, #3a3a3a, #0a0a0a);
    border: 2px solid #2a90ff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 10px; color: #4ab8ff;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
  }
  #steerValue { font-size: 12px; font-weight: bold; color: #4ab8ff; }

  /* ===== ۴ دکمه مربع زیر فرمون ===== */
  #btnRow {
    display: flex;
    gap: 5px;
    height: 58px;
  }
  .sqBtn {
    flex: 1;
    background: linear-gradient(180deg, #0a1a2a, #05101a);
    border: 2px solid #1a4a80;
    border-radius: 10px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 10px;
    color: #cce6ff;
    cursor: pointer;
    box-shadow: inset 0 0 10px rgba(0,80,160,0.3);
    transition: all 0.1s;
    padding: 2px;
  }
  .sqBtn .ic { font-size: 20px; line-height: 1; margin-bottom: 1px; }
  .sqBtn.active {
    border-color: #2a90ff;
    box-shadow: 0 0 18px rgba(42,144,255,0.8), inset 0 0 15px rgba(42,144,255,0.3);
    background: linear-gradient(180deg, #0a2a4a, #0a1a30);
  }
  .sqBtn.emod.active { border-color: #4ade80; box-shadow: 0 0 18px rgba(74,222,128,0.8); }
  .sqBtn.horn.active { border-color: #ffcc00; box-shadow: 0 0 18px rgba(255,204,0,0.8); }

  /* ===== ستون وسط: وینچ ===== */
  #midCol {
    flex: 2.2;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }
  #winchBox {
    flex: 1;
    background: rgba(0,20,40,0.6);
    border: 2px solid #1a4a80;
    border-radius: 12px;
    padding: 6px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: space-between;
    box-shadow: inset 0 0 20px rgba(0,80,160,0.15);
  }
  #winchTitle {
    font-size: 12px; color: #4ab8ff; font-weight: bold;
    letter-spacing: 1px;
    display: flex; align-items: center; gap: 4px;
  }
  #winchArrows {
    display: flex; flex-direction: column; gap: 8px;
    align-items: center; justify-content: center;
    flex: 1; width: 100%;
    padding: 4px 0;
  }
  .winchBtn {
    width: 100%;
    max-width: 110px;
    height: 55px;
    border-radius: 12px;
    background: linear-gradient(180deg, #0a2a4a, #051020);
    border: 2px solid #2a90ff;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; color: #4ab8ff;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(42,144,255,0.5);
    transition: all 0.1s;
  }
  .winchBtn.active {
    background: linear-gradient(180deg, #1a4a80, #0a2a4a);
    box-shadow: 0 0 25px rgba(42,144,255,0.9);
    transform: scale(0.96);
  }
  #winchLabel { font-size: 11px; color: #4ab8ff; letter-spacing: 1px; }

  /* ===== ستون راست ===== */
  #rightCol {
    flex: 3.2;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 0;
  }

  .speedBar {
    background: rgba(0,20,40,0.6);
    border: 2px solid #1a4a80;
    border-radius: 10px;
    padding: 5px 9px;
  }
  .speedBar .label {
    font-size: 11px; color: #8ab8e0;
    margin-bottom: 3px;
    display: flex; justify-content: space-between;
  }
  .barTrack {
    height: 22px;
    background: #05101a;
    border-radius: 5px;
    border: 1px solid #1a3050;
    overflow: hidden;
    position: relative;
    touch-action: none;
  }
  .barFill {
    height: 100%;
    border-radius: 4px;
    width: 0%;
    pointer-events: none;
  }
  .barFill.rear  { background: linear-gradient(90deg, #0060c0, #2a90ff); box-shadow: 0 0 12px #2a90ff; }
  .barFill.front { background: linear-gradient(90deg, #008040, #2aff80); box-shadow: 0 0 12px #2aff80; }
  .barPercent { font-weight: bold; color: #cce6ff; font-size: 12px; }
  .barPercent.green { color: #2aff80; }

  /* ===== دکمه‌های جلو/عقب (بزرگ، لحظه‌ای) ===== */
  #gearBox {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
  }
  .gearBtn {
    flex: 1;
    border-radius: 12px;
    background: linear-gradient(180deg, #0a1a2a, #05101a);
    border: 2px solid #1a4a80;
    color: #8ab8e0;
    font-size: 18px;
    font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.1s;
    touch-action: none;
  }
  .gearBtn.active.fwd { background: #0a3a20; border-color: #2aff80; color: #2aff80; box-shadow: 0 0 22px rgba(42,255,128,0.7); }
  .gearBtn.active.rev { background: #3a0a0a; border-color: #ff4040; color: #ff4040; box-shadow: 0 0 22px rgba(255,64,64,0.7); }

  /* بلوتوث تو ستون راست، بالا */
  #btBtn {
    height: 42px;
    border-radius: 10px;
    background: linear-gradient(180deg, #0a1a2a, #05101a);
    border: 2px solid #1a4a80;
    color: #cce6ff;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer;
    transition: all 0.1s;
  }
  #btBtn.active {
    border-color: #2a90ff;
    box-shadow: 0 0 18px rgba(42,144,255,0.8);
    background: linear-gradient(180deg, #0a2a4a, #0a1a30);
  }
</style>
</head>
<body>

<div id="rotateMsg">📱 لطفاً گوشی رو افقی بگیرید</div>

<div id="panel">
  <div id="statusBar">در حال اتصال...</div>

  <div id="mainRow">

    <!-- ستون چپ -->
    <div id="leftCol">
      <div id="spinBox">
        <div class="spinArrow" data-tank="-1">◀</div>
        <div id="spinLabel">360°</div>
        <div class="spinArrow" data-tank="1">▶</div>
      </div>

      <div id="wheelZone">
        <div id="wheel">
          <div id="hub">
            <div>STEER</div>
            <div id="steerValue">90°</div>
          </div>
        </div>
      </div>

      <div id="btnRow">
        <div class="sqBtn" data-toggle="light">
          <div class="ic">≡D</div>
          <div>light</div>
        </div>
        <div class="sqBtn emod" data-toggle="emod">
          <div class="ic">/|\</div>
          <div>E mod</div>
        </div>
        <div class="sqBtn" data-toggle="smoke">
          <div class="ic">💨</div>
          <div>smoke</div>
        </div>
        <div class="sqBtn horn" data-momentary="horn">
          <div class="ic">📢</div>
          <div>horn</div>
        </div>
      </div>
    </div>

    <!-- ستون وسط: وینچ -->
    <div id="midCol">
      <div id="winchBox">
        <div id="winchTitle">🪝 WINCH</div>
        <div id="winchArrows">
          <div class="winchBtn" data-winch="1">▲</div>
          <div class="winchBtn" data-winch="-1">▼</div>
        </div>
        <div id="winchLabel">توقف</div>
      </div>
    </div>

    <!-- ستون راست -->
    <div id="rightCol">

      <div class="speedBar">
        <div class="label">
          <span>Rear Motors</span>
          <span class="barPercent" id="pctRear">0%</span>
        </div>
        <div class="barTrack" data-motor="rear">
          <div class="barFill rear" id="barRear"></div>
        </div>
      </div>

      <div class="speedBar">
        <div class="label">
          <span>Front Motors</span>
          <span class="barPercent green" id="pctFront">0%</span>
        </div>
        <div class="barTrack" data-motor="front">
          <div class="barFill front" id="barFront"></div>
        </div>
      </div>

      <div id="gearBox">
        <div class="gearBtn fwd" id="btnForward">جلو ▲</div>
        <div class="gearBtn rev" id="btnReverse">عقب ▼</div>
      </div>

      <div id="btBtn" data-toggle="bluetooth">
        <span>☰</span><span>Bluetooth</span>
      </div>

    </div>

  </div>
</div>

<script>
// ================= MQTT =================
const MQTT_HOST = "wss://ncf63ff2.ala.eu-central-1.emqxsl.com:8084/mqtt";
const MQTT_USER = "esp32car";
const MQTT_PASS = "09330572413";

let client = null;
let connected = false;
const statusEl = document.getElementById('statusBar');

function initMqtt() {
  statusEl.textContent = "در حال اتصال...";
  statusEl.className = "";

  client = mqtt.connect(MQTT_HOST, {
    username: MQTT_USER,
    password: MQTT_PASS,
    clientId: "phone_" + Math.random().toString(16).substr(2, 8),
    clean: true,
    reconnectPeriod: 3000,
    connectTimeout: 10000
  });

  client.on('connect', () => {
    connected = true;
    statusEl.textContent = "متصل به سرور";
    statusEl.className = "online";
    client.subscribe('car/status/#');
  });

  client.on('reconnect', () => {
    statusEl.textContent = "در حال اتصال مجدد...";
    statusEl.className = "";
  });

  client.on('close', () => {
    connected = false;
    statusEl.textContent = "قطع شد - تلاش مجدد...";
    statusEl.className = "offline";
  });

  client.on('error', (e) => { console.error('MQTT error:', e); });

  client.on('message', (topic, payload) => {
    const v = payload.toString();
    if (topic === 'car/status/front') document.getElementById('sFront').textContent = v;
    if (topic === 'car/status/rear')  document.getElementById('sRear').textContent  = v;
  });
}

function pub(topic, value) {
  if (!connected) return;
  client.publish(topic, String(value));
}

initMqtt();

// ================= STEERING WHEEL =================
const wheel = document.getElementById('wheel');
const steerValueEl = document.getElementById('steerValue');

let wheelAngle = 0;
let lastSentSteer = -1;
let centerX = 0, centerY = 0, startAngle = 0;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function getCenter() {
  const r = wheel.getBoundingClientRect();
  centerX = r.left + r.width / 2;
  centerY = r.top + r.height / 2;
}
function angleFromPoint(x, y) {
  return Math.atan2(y - centerY, x - centerX) * 180 / Math.PI;
}
function sendSteer(angle) {
  angle = Math.round(angle);
  if (angle === lastSentSteer) return;
  lastSentSteer = angle;
  pub('car/steer', angle);
  steerValueEl.textContent = angle + '°';
}
function wheelStart(x, y) {
  getCenter();
  startAngle = angleFromPoint(x, y) - wheelAngle;
  wheel.classList.add('dragging');
}
function wheelMove(x, y) {
  let raw = angleFromPoint(x, y) - startAngle;
  while (raw - wheelAngle > 180) raw -= 360;
  while (raw - wheelAngle < -180) raw += 360;
  raw = clamp(raw, -180, 180);
  wheelAngle = raw;
  wheel.style.transform = `rotate(${wheelAngle}deg)`;
  const servo = clamp(90 + wheelAngle / 2, 0, 180);
  sendSteer(servo);
}
function returnToCenter() {
  wheel.classList.remove('dragging');
  const step = () => {
    if (Math.abs(wheelAngle) < 1) {
      wheelAngle = 0;
      wheel.style.transform = 'rotate(0deg)';
      sendSteer(90);
      return;
    }
    wheelAngle *= 0.85;
    wheel.style.transform = `rotate(${wheelAngle}deg)`;
    sendSteer(clamp(90 + wheelAngle / 2, 0, 180));
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

let wheelTouchId = null;

// START on the wheel element
wheel.addEventListener('touchstart', e => {
  e.preventDefault();
  if (wheelTouchId !== null) return;
  const t = e.changedTouches[0];
  wheelTouchId = t.identifier;
  wheelStart(t.clientX, t.clientY);
}, { passive: false });

// MOVE / END on window (critical fix!)
window.addEventListener('touchmove', e => {
  if (wheelTouchId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier === wheelTouchId) {
      e.preventDefault();
      wheelMove(t.clientX, t.clientY);
      break;
    }
  }
}, { passive: false });

window.addEventListener('touchend', e => {
  if (wheelTouchId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier === wheelTouchId) {
      wheelTouchId = null;
      returnToCenter();
      break;
    }
  }
});
window.addEventListener('touchcancel', e => {
  if (wheelTouchId === null) return;
  for (const t of e.changedTouches) {
    if (t.identifier === wheelTouchId) {
      wheelTouchId = null;
      returnToCenter();
      break;
    }
  }
});

// mouse support
let mouseDragging = false;
wheel.addEventListener('mousedown', e => { e.preventDefault(); mouseDragging = true; wheelStart(e.clientX, e.clientY); });
window.addEventListener('mousemove', e => { if (mouseDragging) wheelMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (mouseDragging) { mouseDragging = false; returnToCenter(); } });

// ================= SPEED BARS =================
function setupBar(el, motorName, pctEl, fillEl) {
  let touchId = null;

  function setFromX(clientX) {
    const r = el.getBoundingClientRect();
    let pct = ((clientX - r.left) / r.width) * 100;
    pct = Math.round(clamp(pct, 0, 100));
    fillEl.style.width = pct + '%';
    pctEl.textContent = pct + '%';
    if (motorName === 'front') pub('car/speedFront', pct);
    else                        pub('car/speedRear',  pct);
  }

  el.addEventListener('touchstart', e => {
    e.preventDefault();
    if (touchId !== null) return;
    touchId = e.changedTouches[0].identifier;
    setFromX(e.changedTouches[0].clientX);
  }, { passive: false });

  el.addEventListener('touchmove', e => {
    if (touchId === null) return;
    for (const t of e.changedTouches) {
      if (t.identifier === touchId) {
        e.preventDefault();
        setFromX(t.clientX);
        break;
      }
    }
  }, { passive: false });

  el.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === touchId) { touchId = null; break; }
    }
  }, { passive: false });

  el.addEventListener('mousedown', e => { setFromX(e.clientX); });
  el.addEventListener('mousemove', e => { if (e.buttons === 1) setFromX(e.clientX); });
}

setupBar(
  document.querySelector('[data-motor="rear"]'),
  'rear',
  document.getElementById('pctRear'),
  document.getElementById('barRear')
);
setupBar(
  document.querySelector('[data-motor="front"]'),
  'front',
  document.getElementById('pctFront'),
  document.getElementById('barFront')
);

// ================= GEAR (Momentary) =================
const btnForward = document.getElementById('btnForward');
const btnReverse = document.getElementById('btnReverse');

function bindMomentary(el, onStart, onEnd) {
  let touchId = null;

  el.addEventListener('touchstart', e => {
    e.preventDefault();
    if (touchId !== null) return;
    touchId = e.changedTouches[0].identifier;
    onStart();
  }, { passive: false });

  el.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === touchId) {
        touchId = null;
        onEnd();
        break;
      }
    }
  }, { passive: false });
  el.addEventListener('touchcancel', e => {
    if (touchId !== null) { touchId = null; onEnd(); }
  });

  el.addEventListener('mousedown', e => { e.preventDefault(); onStart(); });
  window.addEventListener('mouseup', () => { onEnd(); });
}

bindMomentary(btnForward,
  () => { btnForward.classList.add('active'); pub('car/gear', 1); },
  () => { btnForward.classList.remove('active'); pub('car/gear', 0); }
);
bindMomentary(btnReverse,
  () => { btnReverse.classList.add('active'); pub('car/gear', -1); },
  () => { btnReverse.classList.remove('active'); pub('car/gear', 0); }
);

// ================= TANK (Momentary) =================
document.querySelectorAll('.spinArrow').forEach(btn => {
  const dir = parseInt(btn.dataset.tank);
  let touchId = null;

  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    if (touchId !== null) return;
    touchId = e.changedTouches[0].identifier;
    btn.classList.add('active');
    pub('car/tank', dir);
  }, { passive: false });

  btn.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === touchId) {
        touchId = null;
        btn.classList.remove('active');
        pub('car/tank', 0);
        break;
      }
    }
  }, { passive: false });

  btn.addEventListener('mousedown', e => { e.preventDefault(); btn.classList.add('active'); pub('car/tank', dir); });
  window.addEventListener('mouseup', () => { if (btn.classList.contains('active')) { btn.classList.remove('active'); pub('car/tank', 0); } });
});

// ================= TOGGLE BUTTONS =================
document.querySelectorAll('[data-toggle]').forEach(btn => {
  const cmd = btn.dataset.toggle;
  let state = 0;

  btn.addEventListener('touchstart', e => { e.preventDefault(); toggle(); }, { passive: false });
  btn.addEventListener('click', toggle);

  function toggle() {
    state = state ? 0 : 1;
    btn.classList.toggle('active', state === 1);
    pub('car/' + cmd, state);
  }
});

// ================= MOMENTARY: horn =================
document.querySelectorAll('[data-momentary]').forEach(btn => {
  const cmd = btn.dataset.momentary;
  let touchId = null;

  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    if (touchId !== null) return;
    touchId = e.changedTouches[0].identifier;
    btn.classList.add('active');
    pub('car/' + cmd, 1);
  }, { passive: false });

  btn.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === touchId) {
        touchId = null;
        btn.classList.remove('active');
        pub('car/' + cmd, 0);
        break;
      }
    }
  }, { passive: false });

  btn.addEventListener('mousedown', e => { e.preventDefault(); btn.classList.add('active'); pub('car/' + cmd, 1); });
  window.addEventListener('mouseup', () => { if (btn.classList.contains('active')) { btn.classList.remove('active'); pub('car/' + cmd, 0); } });
});

// ================= WINCH =================
document.querySelectorAll('.winchBtn').forEach(btn => {
  const dir = parseInt(btn.dataset.winch);
  const label = document.getElementById('winchLabel');
  let touchId = null;

  btn.addEventListener('touchstart', e => {
    e.preventDefault();
    if (touchId !== null) return;
    touchId = e.changedTouches[0].identifier;
    btn.classList.add('active');
    label.textContent = dir === 1 ? 'جمع...' : 'باز...';
    pub('car/winch', dir);
  }, { passive: false });

  btn.addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === touchId) {
        touchId = null;
        btn.classList.remove('active');
        label.textContent = 'توقف';
        pub('car/winch', 0);
        break;
      }
    }
  }, { passive: false });

  btn.addEventListener('mousedown', e => { e.preventDefault(); btn.classList.add('active'); label.textContent = dir === 1 ? 'جمع...' : 'باز...'; pub('car/winch', dir); });
  window.addEventListener('mouseup', () => { if (btn.classList.contains('active')) { btn.classList.remove('active'); label.textContent = 'توقف'; pub('car/winch', 0); } });
});
</script>
